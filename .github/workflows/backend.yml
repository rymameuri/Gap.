name: backend

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "data/**"
      - ".github/**"
      - ".githooks/**"
      - "eslint.config.js"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "data/**"
      - ".github/**"
      - ".githooks/**"
      - "eslint.config.js"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:backend
      - run: npm run lint:backend
      - run: npm run format:check:backend
      - run: npm test
      - run: npm run check:forbidden
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run check:forbidden -- --commits "$BASE_SHA..$HEAD_SHA"
